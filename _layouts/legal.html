<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} — LEYDEN</title>
<meta name="description" content="{{ page.title }} for LEYDEN, a calm daily logic puzzle for iPhone. No ads, no accounts, no tracking.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://lubiqet.github.io/leyden-site/{{ page.name | replace: '.md','' }}">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }} — LEYDEN">
<meta property="og:image" content="https://lubiqet.github.io/leyden-site/assets/og.png">
<style>
  :root{
    --bg:#0a0a0a; --ink:#f4f4f7; --muted:#9a9aa2; --gold:#ffc24d; --gold-2:#ffd98a;
    --card:#141414; --line:#242424;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}

  .ember{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
  .ember b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:drift 24s ease-in-out infinite}
  .ember b:nth-child(1){width:560px;height:560px;left:-140px;top:-180px;background:#5a3a12}
  .ember b:nth-child(2){width:480px;height:480px;right:-160px;top:80px;background:#2a2a3a;animation-delay:-9s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.12)}}

  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
    background:rgba(10,10,10,.55);border-bottom:1px solid var(--line)}
  nav .wrap{max-width:1120px;display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
  .brand img{width:30px;height:30px;border-radius:8px}
  .nav-links{display:flex;gap:26px;font-size:15px}
  .nav-links a{color:var(--muted)}.nav-links a:hover{color:var(--ink);text-decoration:none}

  header.hero{padding:70px 0 26px;border-bottom:1px solid var(--line);margin-bottom:44px}
  .kicker{color:var(--gold);font-weight:700;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
  header.hero h1{font-size:clamp(34px,6vw,52px);font-weight:850;letter-spacing:-.02em;margin:12px 0 8px}
  header.hero .sub{color:var(--muted);font-size:16px}

  article{padding-bottom:70px;font-size:16.5px}
  article h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:40px 0 12px;color:var(--ink)}
  article h3{font-size:19px;font-weight:700;margin:28px 0 8px}
  article p{color:#d7d7db;margin:0 0 16px}
  article ul,article ol{color:#d7d7db;padding-left:22px;margin:0 0 16px}
  article li{margin:6px 0}
  article strong{color:var(--ink)}
  article em{color:var(--muted);font-style:normal}
  article hr{border:none;border-top:1px solid var(--line);margin:36px 0}
  article code{background:#1b1b1b;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:.9em}
  article blockquote{border-left:3px solid var(--gold);margin:0 0 16px;padding:6px 0 6px 18px;color:var(--muted)}
  article table{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:15px}
  article th,article td{border:1px solid var(--line);padding:10px 12px;text-align:left}
  article th{background:#161616}

  footer{padding:40px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .foot a{color:var(--muted);margin-right:20px}.foot a:hover{color:var(--gold);text-decoration:none}

  @media (prefers-reduced-motion: reduce){.ember b{animation:none}}
</style>
</head>
<body>
<div class="ember"><b></b><b></b></div>

<nav><div class="wrap">
  <a class="brand" href="./"><img src="assets/icon.png" alt="LEYDEN app icon">LEYDEN</a>
  <div class="nav-links">
    <a href="./">Home</a>
    <a href="privacy-policy">Privacy</a>
    <a href="terms-of-service">Terms</a>
    <a href="support">Support</a>
  </div>
</div></nav>

<header class="hero"><div class="wrap">
  <div class="kicker">LEYDEN</div>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<div class="sub">{{ page.subtitle }}</div>{% endif %}
</div></header>

<article><div class="wrap">
  {{ content }}
</div></article>

<footer><div class="wrap foot">
  <div>© <span id="yr"></span> LEYDEN · A new logic puzzle every day.</div>
  <div>
    <a href="privacy-policy">Privacy</a>
    <a href="terms-of-service">Terms</a>
    <a href="support">Support</a>
  </div>
</div></footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
